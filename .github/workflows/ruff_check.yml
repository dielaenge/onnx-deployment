name: ruff check
on:
  pull_request:
    branches: [main]
    paths: [
      '**.py', 
      'ruff.toml',
      '.github/workflows/ruff_check.yml'
      ]

  push:
    branches: [main]
    paths: [
      '**.py', 
      'ruff.toml',
      '.github/workflows/ruff_check.yml'
      ]
permissions:
  contents: read
jobs:
  ruff:
    name: ruff check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.17.6"
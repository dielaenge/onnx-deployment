name: Build and Deploy - phase 5

on:
  push:
    branches:
      - feat/container-orchestration
  workflow_dispatch: # Adds a "Run Workflow" button in the GitHub UI!

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: bape-inference-tf
  ECS_CLUSTER: bape_cluster
  ECS_SERVICE: bape_ecs_service
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# CRITICAL: These permissions are required for OIDC to work
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to Fargate
    runs-on: ubuntu-latest
    
    # Tells GitHub to run all bash scripts inside the Phase 5 folder
    defaults:
      run:
        working-directory: ./phase-5-container-orchestration

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v5
      with:
        role-to-assume: arn:aws:iam::609662023678:role/github_actions_bape_cd
        aws-region: ${{ env.AWS_REGION }}

    - name: Download ML Model from S3
      run: |
        echo "Downloading ONNX model artifacts from S3..."
        aws s3 cp s3://bape-app-data-phase5-davidg/models/ app/models/ --recursive

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }} # We tag with the Git Commit SHA for history!
      run: |
        # We build for AMD64 (Fargate) and tag it twice: once with the Git SHA, and once as "latest"
        docker build --platform=linux/amd64 -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
        
        # The -a flag pushes ALL tags associated with this image
        docker push -a $ECR_REGISTRY/$ECR_REPOSITORY

    - name: Force ECS Update
      run: |
        # Tells the ECS Service to kill the old container and start a new one, which pulls the new 'latest' image
        aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service ${{ env.ECS_SERVICE }} --force-new-deployment
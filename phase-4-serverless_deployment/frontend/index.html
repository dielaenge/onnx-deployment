<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAPE | Acoustic AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .recording-glow { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
    </style>
</head>
<body class="bg-[#020617] text-slate-200 min-h-screen flex flex-col items-center justify-center p-6 font-sans">
    <div class="max-w-xl w-full space-y-8 text-center">
        <div class="space-y-2">
            <h1 class="text-6xl font-black tracking-tighter bg-gradient-to-br from-white to-slate-500 bg-clip-text text-transparent italic">BAPE</h1>
            <p class="text-slate-500 text-xs uppercase tracking-[0.3em] font-bold">Acoustic Parameter Estimator</p>
        </div>

        <div class="glass rounded-[2rem] p-8 space-y-8 shadow-2xl">
            <div id="status-text" class="text-xs font-bold text-blue-500 uppercase tracking-widest">System Ready</div>
            
            <!-- Mic Section -->
            <div class="flex flex-col items-center space-y-4">
                <button id="mic-btn" class="h-24 w-24 rounded-full bg-slate-900 flex items-center justify-center transition-all duration-500 hover:border-blue-500/50 border-2 border-slate-800 shadow-inner">
                    <svg id="mic-icon" xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 1v11m0 0a4 4 0 004-4V5a4 4 0 00-8 0v3a4 4 0 004 4z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 10v1a7 7 0 01-14 0v-1m10 8a3 3 0 11-6 0" />
                    </svg>
                </button>
                <p class="text-slate-500 text-sm">Tap microphone to record</p>
            </div>

            <div class="flex items-center space-x-4">
                <div class="h-px bg-slate-800 flex-grow"></div>
                <span class="text-slate-600 text-xs font-bold uppercase">or</span>
                <div class="h-px bg-slate-800 flex-grow"></div>
            </div>

            <!-- File Upload Section -->
            <div class="flex justify-center">
                <label class="cursor-pointer group">
                    <input type="file" id="file-input" class="hidden" accept="audio/*">
                    <div class="px-6 py-3 rounded-full bg-slate-800 text-slate-300 text-sm font-semibold group-hover:bg-blue-600 group-hover:text-white transition-all">
                        Upload Audio File
                    </div>
                </label>
            </div>

            <!-- Result Area -->
            <div id="result-area" class="hidden space-y-4 pt-4 border-t border-slate-800 text-left">
                <h3 class="text-emerald-500 uppercase text-[10px] font-black tracking-widest">Latent Vector Result</h3>
                <pre id="json-result" class="text-[10px] bg-black/40 p-4 rounded-xl overflow-x-auto font-mono text-emerald-400 border border-emerald-500/10"></pre>
            </div>
        </div>
    </div>

    <script>
        const micBtn = document.getElementById('mic-btn');
        const fileInput = document.getElementById('file-input');
        const statusText = document.getElementById('status-text');
        const jsonResult = document.getElementById('json-result');
        const resultArea = document.getElementById('result-area');

        let mediaRecorder;
        let audioChunks = [];

        // --- MICROPHONE LOGIC ---
        micBtn.onclick = async () => {
            if (!mediaRecorder || mediaRecorder.state === 'inactive') {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => upload(new Blob(audioChunks, { type: 'audio/wav' }));
                    mediaRecorder.start();
                    micBtn.classList.add('recording-glow', 'border-red-500');
                    statusText.innerText = "Recording...";
                } catch (err) { alert("Mic access denied."); }
            } else {
                mediaRecorder.stop();
                micBtn.classList.remove('recording-glow', 'border-red-500');
                statusText.innerText = "Processing...";
            }
        };

        // --- FILE UPLOAD LOGIC ---
        fileInput.onchange = (e) => {
            if (e.target.files.length > 0) {
                statusText.innerText = "Uploading...";
                upload(e.target.files[0]);
            }
        };

        // --- SHARED UPLOAD FUNCTION ---
        async function upload(blob) {
            const formData = new FormData();

            // LOGIC: Check if it's a file with a name, otherwise default to 'mic_recording'
            let filename = 'mic_recording.wav'; 
            if (blob.name) {
                filename = blob.name;
            }
            // append with file name
            formData.append('audio_file', blob, filename);

            try {
                const response = await fetch('https://7ng4jbdvj2cd4s7ewneapjwaai0hyilw.lambda-url.eu-central-1.on.aws/acou-vec/generate', { method: 'POST', body: formData });
                const data = await response.json();
                resultArea.classList.remove('hidden');
                jsonResult.textContent = JSON.stringify(data, null, 2);
                statusText.innerText = "Success";
            } catch (err) {
                statusText.innerText = "Failed";
                console.error(err);
            }
        }
    </script>
</body>
</html>

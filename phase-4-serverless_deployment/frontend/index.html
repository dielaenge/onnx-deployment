<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAPE | Blind Acoustic Parameter Estimator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .recording-glow { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
    </style>
</head>

<body class="bg-[#020617] text-slate-200 min-h-screen flex flex-col items-center justify-center p-6 font-sans">
    <div class="max-w-xl w-full space-y-8 text-center">
        <div class="space-y-2">
            <h1 class="text-6xl font-black tracking-tighter bg-gradient-to-br from-white to-slate-500 bg-clip-text text-transparent italic">BAPE</h1>
            <p class="text-slate-500 text-xs uppercase tracking-[0.3em] font-bold">Blind Acoustic Parameter Estimator</p>
        </div>

        <div class="glass rounded-[2rem] p-8 space-y-8 shadow-2xl">
            <div class="flex items-center justify-center space-x-3">
                <div id="spinner" class="hidden h-4 w-4 border-2 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                <div id="status-text" class="text-xs font-bold text-blue-500 uppercase tracking-widest">System Ready</div>
            </div>
            <!-- Mic Section -->
            <div class="flex flex-col items-center space-y-4">
                <button id="mic-btn" class="h-24 w-24 rounded-full bg-slate-900 flex items-center justify-center transition-all duration-500 hover:border-blue-500/50 border-2 border-slate-800 shadow-inner">
                    <svg id="mic-icon" xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 1v11m0 0a4 4 0 004-4V5a4 4 0 00-8 0v3a4 4 0 004 4z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 10v1a7 7 0 01-14 0v-1m10 8a3 3 0 11-6 0" />
                    </svg>
                </button>
                <p class="text-slate-500 text-sm">Tap microphone to record</p>
            </div>

            <div class="flex items-center space-x-4">
                <div class="h-px bg-slate-800 flex-grow"></div>
                <span class="text-slate-600 text-xs font-bold uppercase">or</span>
                <div class="h-px bg-slate-800 flex-grow"></div>
            </div>

            <!-- File Upload Section -->
            <div class="flex justify-center">
                <label class="cursor-pointer group">
                    <input type="file" id="file-input" class="hidden" accept="audio/*">
                    <div class="px-6 py-3 rounded-full bg-slate-800 text-slate-300 text-sm font-semibold group-hover:bg-blue-600 group-hover:text-white transition-all">
                        Upload Audio File
                    </div>
                </label>
            </div>

            <!-- Result Area -->
            <div id="result-area" class="hidden space-y-4 pt-4 border-t border-slate-800 text-left">
                <div id="visual-verification" class="space-y-4">
                    <h3 class="text-xs font-bold uppercase text-slate-500">Preprocessed Input (16kHz Mono, wav)</h3>
                    <audio id="audio-player" controls class="w-full"></audio>
    
                    <h3 class="text-xs font-bold uppercase text-slate-500">Input Spectrogram</h3>
                    <img id="spectrogram-display" class="rounded-lg border border-slate-700 w-full" />
                </div>
                <div class="space-y-2 mt-8">
                    <h3 class="text-emerald-500 uppercase text-[10px] font-black tracking-widest">Acoustic Parameter Timeline</h3>
                    <div id="chart-container" class="w-full h-80 bg-black/40 rounded-xl border border-emerald-500/10 relative overflow-hidden">
                    <!-- D3.js injects SVG here -->
                    </div>
                </div>
                <h3 class="text-emerald-500 uppercase text-[10px] font-black tracking-widest">Results</h3>
                <pre id="json-result" class="text-[10px] bg-black/40 p-4 rounded-xl overflow-x-auto font-mono text-emerald-400 border border-emerald-500/10"></pre>
            </div>
        </div>
    </div>

    <script>
        const micBtn = document.getElementById('mic-btn');
        const fileInput = document.getElementById('file-input');
        const statusText = document.getElementById('status-text');
        const jsonResult = document.getElementById('json-result');
        const resultArea = document.getElementById('result-area');

        let mediaRecorder;
        let audioChunks = [];

        // --- MICROPHONE LOGIC ---
        micBtn.onclick = async () => {
            if (!mediaRecorder || mediaRecorder.state === 'inactive') {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => upload(new Blob(audioChunks, { type: 'audio/wav' }));
                    mediaRecorder.start();
                    micBtn.classList.add('recording-glow', 'border-red-500');
                    statusText.innerText = "Recording...";
                } catch (err) { alert("Mic access denied."); }
            } else {
                mediaRecorder.stop();
                micBtn.classList.remove('recording-glow', 'border-red-500');
                statusText.innerText = "Processing...";
            }
        };

        // --- FILE UPLOAD LOGIC ---
        fileInput.onchange = (e) => {
            if (e.target.files.length > 0) {
                statusText.innerText = "Processing...";
                document.getElementById('spinner').classList.remove('hidden');
                upload(e.target.files[0]);
            }
        };
        
        // DATA VIZ
        function drawChart(timeline) {
            // 1. Data Prep: Extract the estimate at index[1] with confidence interval from index[0] to index[2]
            const data = timeline.map(d => ({
                time: d.timestamp_step,
                low:  d.BAPEs[0], // Lower bound of 1st parameter confidence interval
                val:  d.BAPEs[1], // Actual estimate of 1st parameter
                high: d.BAPEs[2]  // Upper bound of 1st parameter confidence interval
            }));

            const container = document.getElementById('chart-container');
            const width = container.clientWidth;
            const height = container.clientHeight;

            // 2. Clear previous chart
            d3.select("#chart-container").selectAll("*").remove();

            const svg = d3.select("#chart-container")
                .append("svg")
                .attr("width", width)
                .attr("height", height);

            // 3. Define Scales (Scales translate data values, the INPUT DOMIAN, to screen values, the OUTPUT RANGE)

            // x-axis:time
            const xScale = d3.scaleLinear()
                .domain([0, d3.max(data, d => d.time)]) // INPUT from 0 max value from d.time
                .range([50, width - 20]); // OUTPUT starting at 50px and ending 20px before max width

            // y-axis: estimate
            const yScale = d3.scaleLinear()
                .domain([
                    d3.min(data, d => d.low) * 0.9, // INPUT MIN is lowest lower bound value (d.low); scale by 0.9 to add space beneath
                    d3.max(data, d => d.high) * 1.1 // INPUT MX is highest upper bound value (d.high); scale by 1.1 to add space above
                ])
                .range([height - 30, 20]); // OUTPUT starting at (max height - 30px), ending at 20px height


            
            // define an area chart with .low and .high, and a line chart with the actual .val
            
            // create area generator
            const areaGenerator = d3.area()
            .x(d => xScale(d.time)) //get x-value from time step
            .y0(d => yScale(d.low)) //get lower bound confidence
            .y1(d => yScale(d.high)) //get upper bound confidence
            //optional line-smoothing
            .curve(d3.curveMonotoneX); 

            //   create line generator
            const lineGenerator = d3.line()
            .x(d => xScale(d.time)) // take timestampe_step values and scale to x-axis
            .y(d => yScale(d.val)) // take BAPEs value at index[1]
            //optional line-smoothing
            .curve(d3.curveMonotoneX);


            // Layer the visualization

            // append grid/axes (background)
            // x-axis at bottom
            svg.append("g")
                .attr("transform", `translate(0, ${height - 30})`) // place at bottom
                .call(d3.axisBottom(xScale)) // Constructs a new bottom-oriented axis generator for the given scale, with empty tick arguments, a tick size of 6 and padding of 3
            
            // y-axis to the left
            svg.append("g")
                .attr("transform", `translate(50 ,0)`) // move right to keep margin
                .call(d3.axisLeft(yScale)) // Constructs a new bottom-oriented axis generator for the given scale, with empty tick arguments, a tick size of 6 and padding of 3

            // append area (middleground)
            svg.append("path")
                .datum(data) // ENTIRE input array available to drawChart is bound to path
                .attr("fill", "rgba(16, 185, 129, 0.2)") // fill area with opacity
                .attr("stroke", "none") // area doesn't have an outline
                .attr("d", areaGenerator) // calculate the path of the area using the areaGenerator

            // append line (foreground)
            svg.append("path")
                .datum(data)
                .attr("fill", "none")
                .attr("stroke", "#10b981") // Solid Emerald
                .attr("stroke-width", 2)
                .attr("d", lineGenerator);
        }

        // --- MAIN LOGIC ---
        async function upload(blob) {
            const formData = new FormData();

            // LOGIC: Check if it's a file with a name, otherwise default to 'mic_recording'
            let filename = 'mic_recording.wav'; 
            if (blob.name) {
                filename = blob.name;
            }
            // append with file name
            formData.append('audio_file', blob, filename);

            // Simulating a progress timer if it's a cold start
            let progressSeconds = 0;
            const progressInterval = setInterval(() => {
                progressSeconds++;
                if (progressSeconds === 10) statusText.innerText = "Cold Start… Waking up Inference Engine...";
                if (progressSeconds === 16) statusText.innerText = "Loading ONNX Model...";
                if (progressSeconds === 22) statusText.innerText = "Normalizing Audio via FFmpeg...";
                if (progressSeconds === 26) statusText.innerText = "Kannst du arbeiten?";
                if (progressSeconds === 28) statusText.innerText = "Running Acoustic Inference...";
                }, 1000);

            try {
                const response = await fetch('https://7ng4jbdvj2cd4s7ewneapjwaai0hyilw.lambda-url.eu-central-1.on.aws/acou-vec/generate', { method: 'POST', body: formData });
                const data = await response.json();
                const presigned_urls = data.preprocessed_inputs;

                // 1. Set the Audio Player source
                if (presigned_urls.wav_url) {
                    document.getElementById('audio-player').src=presigned_urls.wav_url;
                }
                // 2. Set the Spectrogram Image source
                if (presigned_urls.png_url) {
                    document.getElementById('spectrogram-display').src=presigned_urls.png_url;
                }
                
                // Clear the timer once the real data arrives
                clearInterval(progressInterval);
                document.getElementById('spinner').classList.add('hidden');

                drawChart(data.timeline_of_results)
                resultArea.classList.remove('hidden');
                jsonResult.textContent = JSON.stringify(data, null, 2);
                statusText.innerText = "Analysis Complete";
            } catch (err) {
                statusText.innerText = "Failed";
                console.error(err);
            }
        }
    </script>
</body>
</html>

# @package _global_

defaults:
  - _self_
  - data: speech_ctr
  - model: speech_encoder_ctr
  - trainer: speech_encoder_ctr

# sets logging directory to debug
debug: false

# embedding adapter to low-dim space for contrastive loss
adapter:
  _target_: src.model.mlp.DenseBlock
  in_features: 1024
  out_features: 128
  use_norm: true
  activation: tanh

# hydra configuration
hydra:
  job:
    chdir: false
  run:
    dir: "."
  output_subdir: null
  job_logging:
    root: null
  sweep:
    dir: "."
    subdir: "." 
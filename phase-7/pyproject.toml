[project]
name = "phase-7"
version = "0.1.0"
requires-python = ">=3.11, <3.12"
dependencies = [
    # Core API
    "fastapi==0.127.1",
    "uvicorn[standard]>=0.54.0",
    "python-multipart==0.0.21",

    # ML Runtime
    "numpy<2.0.0",
    "onnxruntime>=1.31.0",
    "scikit-learn==1.3.2",
    "scipy==1.12.0",

    # Audio Processing
    "librosa==0.11.0",
    "numba==0.59.1",
    "soundfile==0.13.1",
    "soxr==0.3.7",

    # Utils (Used by BAPE)
    "pyyaml>=6.0.3",
    "coloredlogs==15.0.1",    
    "humanfriendly==10.0",


    # Frontend
    "aiofiles>=25.1.0",

    # Visualization
    "matplotlib==3.8.2",

    # AWS Python SDK
    "boto3>=1.43.116",
]

[dependency-groups]
onnx_export = [
    "einops>=0.8.2",
    "hydra-core>=1.3.7",
    "omegaconf>=2.3.1",
    "onnxscript>=0.7.2",
    "torch>2.0.0",
    "torchaudio>=2.11.0",
]
